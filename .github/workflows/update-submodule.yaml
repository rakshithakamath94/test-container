name: Auto Update Submodule
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: 

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config --global user.email "rakshithakamath94@gmail.com"
          git config --global user.name "Rakshitha Kamath"

      - name: Update submodule to latest remote version
        run: |
          git submodule update --init --recursive --remote -f
          if ! git diff --submodule --quiet HEAD; then
            echo "There are uncommitted changes (staged or unstaged)."
            git add test
          else
            echo "No uncommitted changes."
            exit 0
          fi

      - name: Commit and Push changes
        run: |
          git commit -s -m 'Update submodule to latest'
          git push origin release-9.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
