name: Update Submodule
on:
  repository_dispatch:
    types:
      - update-submodule
jobs:
  update-submodule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Authorize Git
        run: |
          git config --global user.name "Rakshitha Kamath"
          git config --global user.email "rakshithakamath94@gmail.com"
      - name: Update submodule
        run: |
          git submodule update --init --recursive -f
      - name: Commit changes
        run: |
          git add test
          git commit -m "Update submodule to latest commit"
          git push origin release-9.1
