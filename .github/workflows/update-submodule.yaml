name: Auto Update Submodule
on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch: 

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config --global user.email "rakshithakamath94@gmail.com"
          git config --global user.name "Rakshitha Kamath"

      - name: Update submodule to latest remote version
        id: check_commits
        run: |
          git submodule update --init --recursive --remote -f
          git diff --submodule

      - name: Commit and Push changes
        if: steps.check_commits.outcome == '0'
        run: |
          git add test/
          git commit -s -m 'Update submodule to latest'
          git push origin release-9.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
